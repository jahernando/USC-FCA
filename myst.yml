version: 1

project:
  id: usc-fca-book
  title: Advanced Computational Physics
  subtitle: Tools, functional and object-oriented programming
  description: >
    Lecture notes on the shell, version control, and functional and
    object-oriented programming in Python, from the course on Advanced
    Computational Physics of the Physics Master of the Universidade de
    Santiago de Compostela.
  authors:
    - name: J. A. Hernando Morata
      affiliations:
        - Universidade de Santiago de Compostela
  github: https://github.com/jahernando/USC-FCA
  toc:
    - file: README.md
    - title: "Tools: UNIX and git"
      children:
        - file: fca_unix.ipynb
        - file: fca_git.ipynb
    - title: "Python: functional programming"
      children:
        - file: python_intro.ipynb
        - file: about_functions.ipynb
        - file: about_testing.ipynb
        - file: about_list_expressions.ipynb
        - file: about_iterators.ipynb
    - title: "Python: object-oriented programming"
      children:
        - file: classes_intro.ipynb
        - file: classes.ipynb
        - file: classes_inheritance.ipynb
        - file: fp_or_oop.ipynb

site:
  template: book-theme
  options:
    logo_text: FCA
    style: ./book.css
