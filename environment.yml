# Course environment — Advanced Computational Physics (USC)
#
#   conda env create -f environment.yml
#   conda activate fca
#
name: fca
channels:
  - conda-forge
dependencies:
  - python=3.13
  # Jupyter
  - jupyterlab
  - notebook
  - nbconvert
  - ipywidgets
  - jupyterlab_rise        # slides; the classic `rise` package does not work with Jupyter 7
  # Scientific stack
  - numpy>=2               # numpy 2 API
  - scipy>=1.15            # bootstrap(rng=), sph_harm_y
  - matplotlib
  - seaborn
  - pandas>=3              # Copy-on-Write, str dtype
  - pytables               # HDF5 files from pandas
  - sympy
  # Physics: Lorentz vectors (Scikit-HEP)
  - vector
  # Testing
  - pytest
  - hypothesis
  # The book (jupyter-book 2, built on MyST)
  - jupyter-book
  - pip
