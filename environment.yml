# Course environment — Advanced Computational Physics (USC)
#
#   conda env create -f environment.yml
#   conda activate fca
#
name: fca
channels:
  - conda-forge
dependencies:
  - python=3.13
  # Jupyter
  - jupyterlab
  - notebook
  - nbconvert
  - ipywidgets
  - jupyterlab_rise        # slides; the classic `rise` package does not work with Jupyter 7
  # Scientific stack
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - pandas
  - sympy
  # Physics: Lorentz vectors (Scikit-HEP)
  - vector
  # Testing
  - pytest
  - hypothesis
  # The book (jupyter-book 2, built on MyST)
  - jupyter-book
  - pip
